<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="/assets/logo.png" type="image/png">
</head>
<body data-section="{{section}}">
<header class="site">
  <div class="wrap nav">
    <a class="brand-link" href="/">
      <img class="logo" src="/assets/logo.png" alt="凌極世界 logo" onerror="this.outerHTML='<span class=&quot;logo-ph&quot;>[logo]</span>'">
      <span class="brand">{{siteName}}<small>{{enName}}</small></span>
    </a>
    <nav class="links" aria-label="主導覽">{{nav}}</nav>
    <button class="menu-btn" aria-label="開啟選單" aria-expanded="false">☰</button>
  </div>
  <nav class="mobile-nav" aria-label="行動版導覽">{{nav}}</nav>
</header>

<main>
<div class="wrap prose">
{{content}}
</div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-brand">{{siteName}} <span>{{enName}}</span></div>
    <div class="foot-contact">{{emails}}<br>Instagram {{instagram}}</div>
    <div class="foot-note">{{footerNote}}</div>
  </div>
</footer>

<script src="/assets/site.js" defer></script>
</body>
</html>
